<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alert — preview</title></head>
<body>
<div id="root"></div>
<script>
  var E = window.ERS, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h('div', {style:{display:'flex',flexDirection:'column',gap:12,padding:16}},
   h(E.Alert, {tone:'success', title:'Application sent'}, "Sofia usually replies within an hour."),
   h(E.Alert, {tone:'warning', title:'Rent due in 3 days', action:h(E.Button, {size:'sm'}, 'Pay $2,450')}, 'Pay by 1 March to avoid a late fee.'),
   h(E.Alert, {tone:'danger', title:"We couldn't verify your ID", onDismiss:function(){}}, 'Upload a clearer photo of the front of your ID.'),
   h(E.Alert, {tone:'info'}, 'Prices include water and building fees.')));
</script>
</body>
</html>

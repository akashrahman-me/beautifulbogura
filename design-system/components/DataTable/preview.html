<!-- @dsCard group="Dashboard" height=380 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataTable — preview</title></head>
<body>
<div id="root"></div>
<script>
  var E = window.ERS, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
  var tone={Paid:'success',Pending:'warning',Overdue:'danger'};
  root.render(h('div', {style:{padding:16}}, h(E.DataTable, {caption:'March rent', rowKey:'id', columns:[
   {key:'unit', label:'Property', render:function(r){ return h('span', {className:'ers-cellprop'}, h('span', {className:'ers-cellprop__thumb'}, h(E.ImagePlaceholder, {kind:r.kind})), h('span', null, r.unit, h('span', {className:'ers-cellprop__sub'}, r.addr))); }},
   {key:'tenant', label:'Tenant'},
   {key:'due', label:'Due'},
   {key:'status', label:'Status', render:function(r){ return h(E.Badge, {tone:tone[r.status], icon:r.status==='Paid'?'check':r.status==='Overdue'?'alert':'clock'}, r.status); }},
   {key:'amount', label:'Amount', align:'right', render:function(r){ return h(E.Price, {amount:r.amount, size:'sm', period:null}); }}],
   rows:[{id:1, unit:'Loft 2B', addr:'Alfama', kind:'apartment', tenant:'Maya Lin', due:'1 Mar', status:'Paid', amount:2450},{id:2, unit:'Garden house', addr:'Belém', kind:'house', tenant:'Daniel Okafor', due:'1 Mar', status:'Pending', amount:3200},{id:3, unit:'Studio 4A', addr:'Graça', kind:'townhouse', tenant:'Arjun Mehta', due:'25 Feb', status:'Overdue', amount:1250}]})));
</script>
</body>
</html>

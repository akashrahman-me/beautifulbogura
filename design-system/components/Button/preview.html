<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title><style>.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style></head>
<body>
<div id="root" class="ers-demo"></div>
<script>
  var E = window.ERS, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h('div', {style:{display:'flex',flexDirection:'column',gap:12}},
    h('div', {className:'row'}, h(E.Button, {variant:'primary'}, 'Request to rent'), h(E.Button, {variant:'secondary', iconLeft:'chat'}, 'Message landlord'), h(E.Button, {variant:'ghost', iconLeft:'share'}, 'Share'), h(E.Button, {variant:'accent', iconLeft:'trend-up'}, 'Boost listing'), h(E.Button, {variant:'danger', iconLeft:'trash'}, 'Delete')),
    h('div', {className:'row'}, h(E.Button, {size:'sm'}, 'Small'), h(E.Button, {size:'md'}, 'Medium'), h(E.Button, {size:'lg', iconRight:'arrow-right'}, 'Large'), h(E.Button, {loading:true}, 'Sending'), h(E.Button, {disabled:true, variant:'secondary'}, 'Disabled'), h(E.Button, {variant:'link'}, 'View lease terms'))));
</script>
</body>
</html>

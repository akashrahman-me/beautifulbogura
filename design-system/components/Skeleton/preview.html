<!-- @dsCard group="Feedback" height=360 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Skeleton — preview</title><style>.g{display:grid;gap:16px;padding:16px;grid-template-columns:repeat(3,1fr)}</style></head>
<body>
<div id="root"></div>
<script>
  var E = window.ERS, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
  function SkelCard(){ return h('div', {style:{display:'flex',flexDirection:'column',gap:8}}, h(E.Skeleton, {variant:'rect', style:{aspectRatio:'4/3', height:'auto'}}), h(E.Skeleton, {width:'70%'}), h(E.Skeleton, {width:'50%'}), h(E.Skeleton, {width:'35%'})); }
  root.render(h('div', {className:'g'}, h(SkelCard), h(SkelCard), h(SkelCard)));
</script>
</body>
</html>

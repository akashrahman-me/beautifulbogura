<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title><style>.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;padding:16px}.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:var(--radius-sm);color:var(--ink);font-size:11px;color:var(--ink-muted)}.cell svg{color:var(--ink)}</style></head>
<body>
<div id="root"></div>
<script>
  var E = window.ERS, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
  var names = E.Icon.names;
  root.render(h('div', {className:'grid'}, names.map(function(n){ return h('div', {key:n, className:'cell'}, h(E.Icon, {name:n, size:22}), h('span', null, n)); })));
</script>
</body>
</html>
